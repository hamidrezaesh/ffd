name: Cross-platform Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch, or commit to test"
        required: true
        default: "main"

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build -o ffd${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/ffd

      - name: Download test file
        run: ./ffd${{ runner.os == 'Windows' && '.exe' || '' }} https://testfile.to/dl/100mb

      - name: Verify SHA-256
        shell: bash
        env:
          EXPECTED_SHA256: "20492a4d0d84f8beb1767f6616229f85d44c2827b64bdbfb260ee12fa1109e0e"
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ACTUAL_SHA256=$(certutil -hashfile 100mb SHA256 | sed -n '2p' | tr -d ' ')
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ACTUAL_SHA256=$(shasum -a 256 100mb | awk '{print $1}')
          else
            ACTUAL_SHA256=$(sha256sum 100mb | awk '{print $1}')
          fi

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "❌ SHA-256 mismatch"
            exit 1
          fi

          echo "✅ SHA-256 verified"