version: 2

builds:
  - id: linux
    main: .
    binary: ffd
    ldflags:
      - -s -w -X github.com/hamidrezaesh/ffd/internal/version.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: darwin
    main: .
    binary: ffd
    ldflags:
      - -s -w -X github.com/hamidrezaesh/ffd/internal/version.Version={{.Version}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  - id: windows
    main: .
    binary: ffd
    ldflags:
      - -s -w -X github.com/hamidrezaesh/ffd/internal/version.Version={{.Version}}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: linux
    ids:
      - linux
    formats:
      - tar.gz
    files:
      - docs/ffd.1

  - id: darwin
    ids:
      - darwin
    formats:
      - tar.gz
    files:
      - docs/ffd.1

  - id: windows
    ids:
      - windows
    formats:
      - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
  filters:
    include:
      - "^feat"
      - "^fix"
      - "^perf"
      - "^refactor"
